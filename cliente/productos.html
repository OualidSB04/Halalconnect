<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalalConnect — Productos</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <div class="app-layout">

        <div class="topbar">
            <div>
                <div class="topbar-title">Productos Halal</div>
                <div class="topbar-subtitle">Catalogo completo de productos certificados</div>
            </div>
            <div class="topbar-actions">
                <input type="text" id="buscador" placeholder="Buscar producto..." oninput="filtrarProductos()">
                <button class="btn-add" onclick="abrirModal()">+ Nuevo Producto</button>
            </div>
        </div>

        <div class="page-content">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Marca</th>
                            <th>Categoria</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Empresa</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-productos">
                        <tr><td colspan="7" style="text-align:center;padding:30px;color:#64748b">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3 id="modal-titulo">Nuevo Producto</h3>
            <form id="formProducto">
                <input type="hidden" id="producto-id">
                <div class="form-group">
                    <label>Empresa Cliente *</label>
                    <select id="cliente_id" required>
                        <option value="">Selecciona empresa...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Categoria</label>
                    <select id="categoria_id">
                        <option value="">Selecciona categoria...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Nombre del Producto *</label>
                    <input type="text" id="nombre" required placeholder="Ej: Pollo entero Halal">
                </div>
                <div class="form-group">
                    <label>Marca</label>
                    <input type="text" id="marca" placeholder="Ej: Al-Halal">
                </div>
                <div class="form-group">
                    <label>Descripcion</label>
                    <textarea id="descripcion" rows="3" placeholder="Describe el producto..."></textarea>
                </div>
                <div class="form-group">
                    <label>Codigo de Barras</label>
                    <input type="text" id="codigo_barras" placeholder="Ej: 8412345678901">
                </div>
                <div class="form-group">
                    <label>Precio (€)</label>
                    <input type="number" id="precio" step="0.01" placeholder="Ej: 8.50">
                </div>
                <div class="form-group">
                    <label>Stock disponible</label>
                    <input type="number" id="stock" placeholder="Ej: 50">
                </div>
                <div class="form-group">
                    <label>URL de Imagen</label>
                    <input type="text" id="imagen_url" placeholder="https://... (opcional)">
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/sidebar.js"></script>
    <script>generarSidebar('productos');</script>
    <script src="js/productos.js"></script>
</body>
</html>
