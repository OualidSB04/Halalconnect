<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalalConnect — Tiendas Halal</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .mk-nav {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 40px; background: rgba(10,15,29,0.85);
            backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }
        .mk-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .mk-brand-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 12px; display: flex; align-items: center;
            justify-content: center; font-size: 20px;
            box-shadow: 0 4px 12px var(--primary-glow);
        }
        .mk-brand-name { font-size: 18px; font-weight: 800; color: var(--text); }
        .mk-brand-sub { font-size: 11px; color: var(--text-dim); }
        .mk-nav-links { display: flex; align-items: center; gap: 8px; }
        .mk-nav-links a {
            color: var(--text-muted); text-decoration: none; font-size: 14px;
            padding: 9px 16px; border-radius: 10px; transition: all 0.2s ease;
        }
        .mk-nav-links a:hover { color: var(--text); background: var(--bg-surface-2); }

        .map-container { max-width: 1200px; margin: 0 auto; padding: 30px 40px 60px; }
        .map-head { text-align: center; margin-bottom: 28px; }
        .map-head h1 {
            font-size: 34px; font-weight: 800; color: var(--text);
            letter-spacing: -0.02em; margin-bottom: 10px;
        }
        .map-head p { font-size: 16px; color: var(--text-muted); }

        .map-filtros {
            display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
            justify-content: center;
        }
        .map-filtros input, .map-filtros select {
            padding: 12px 16px; background: var(--bg-surface); border: 1px solid var(--border);
            border-radius: 10px; color: var(--text); font-size: 14px; font-family: inherit;
            min-width: 200px;
        }
        .map-filtros input:focus, .map-filtros select:focus {
            outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow);
        }

        #mapa {
            height: 540px; width: 100%; border-radius: 18px;
            border: 1px solid var(--border);
        }
        .map-contador {
            text-align: center; font-size: 14px; color: var(--text-dim); margin-bottom: 14px;
        }
        .map-contador span { color: var(--primary); font-weight: 700; }

        .leaflet-popup-content-wrapper {
            background: var(--bg-surface); border: 1px solid var(--border);
            color: var(--text); border-radius: 12px;
        }
        .leaflet-popup-tip { background: var(--bg-surface); }
        .leaflet-popup-content strong { color: var(--primary); font-size: 14px; }
        .leaflet-popup-content p { margin: 4px 0; font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>

    <nav class="mk-nav">
        <a href="marketplace.html" class="mk-brand">
            <div class="mk-brand-icon">☪</div>
            <div>
                <div class="mk-brand-name">HalalConnect</div>
                <div class="mk-brand-sub">Marketplace Halal de confianza</div>
            </div>
        </a>
        <div class="mk-nav-links">
            <a href="marketplace.html">Productos</a>
            <a href="market_map.html">Tiendas</a>
            <a href="verificar.html">Verificar</a>
            <a href="denunciar.html">Reportar</a>
        </div>
    </nav>

    <div class="map-container">
        <div class="map-head">
            <h1>Encuentra tiendas Halal cerca de ti</h1>
            <p>Todos los establecimientos verificados y certificados de España</p>
        </div>

        <div class="map-filtros">
            <input type="text" id="buscar-mapa" placeholder="Buscar por nombre o ciudad..." oninput="filtrarMapa()">
            <select id="filtro-tipo" onchange="filtrarMapa()">
                <option value="">Todos los tipos</option>
                <option value="Restaurante">Restaurante</option>
                <option value="Carniceria">Carnicería</option>
                <option value="Supermercado">Supermercado</option>
                <option value="Tienda">Tienda</option>
                <option value="Panaderia">Panadería</option>
                <option value="Otro">Otro</option>
            </select>
        </div>

        <div class="map-contador">Mostrando <span id="contador">0</span> tiendas verificadas</div>

        <div id="mapa"></div>
    </div>

    <script src="js/market_map.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
