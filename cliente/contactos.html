<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalalConnect — Contactos</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <div class="app-layout">

        <div class="topbar">
            <div>
                <div class="topbar-title">Contactos</div>
                <div class="topbar-subtitle" id="subtitulo-cliente">Personas de contacto del cliente</div>
            </div>
            <div class="topbar-actions">
                <button class="btn-secondary" onclick="window.location.href='clientes.html'">
                    ← Volver a Clientes
                </button>
                <button class="btn-add" onclick="abrirModal()">+ Nuevo Contacto</button>
            </div>
        </div>

        <div class="page-content">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Cargo</th>
                            <th>Telefono</th>
                            <th>Email</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-contactos">
                        <tr><td colspan="5" style="text-align:center;padding:30px;color:#64748b">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3 id="modal-titulo">Nuevo Contacto</h3>
            <form id="formContacto">
                <input type="hidden" id="contacto-id">
                <div class="form-group">
                    <label>Nombre Completo *</label>
                    <input type="text" id="nombre" required placeholder="Ej: Ahmed Al-Rashid">
                </div>
                <div class="form-group">
                    <label>Cargo</label>
                    <input type="text" id="cargo" placeholder="Ej: Director General">
                </div>
                <div class="form-group">
                    <label>Telefono</label>
                    <input type="text" id="telefono" placeholder="Ej: 612345678">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Ej: ahmed@empresa.es">
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/sidebar.js"></script>
    <script>generarSidebar('clientes');</script>
    <script src="js/contactos.js"></script>
</body>
</html>
