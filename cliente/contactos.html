<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalalConnect — Contactos</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">
            <img src="imagenes/logo.png" alt="Logo" class="navbar-logo">
            HalalConnect
        </div>
        <div class="navbar-menu">
            <a href="dashboard.html">Dashboard</a>
            <a href="clientes.html">Clientes</a>
            <a href="certificaciones.html">Certificaciones</a>
            <span id="usuario-nombre"></span>
            <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h2>Contactos de <span id="nombre-cliente">...</span></h2>
            <div class="header-actions">
                <button class="btn-secondary" onclick="volverClientes()">← Volver a Clientes</button>
                <button class="btn-add" onclick="abrirModal()">+ Nuevo Contacto</button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Cargo</th>
                        <th>Teléfono</th>
                        <th>Email</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-contactos">
                    <tr><td colspan="5" style="text-align: center; padding: 30px;">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3 id="modal-titulo">Nuevo Contacto</h3>
            <form id="formContacto">
                <input type="hidden" id="contacto-id">
                <div class="form-group">
                    <label>Nombre Completo *</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="form-group">
                    <label>Cargo</label>
                    <input type="text" id="cargo" placeholder="Ej: Director General, Jefe de Compras...">
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="text" id="telefono">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email">
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/contactos.js"></script>
</body>
</html>
