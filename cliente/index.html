<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalalConnect — Iniciar Sesión</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="login-page">

    <div class="login-wrapper">
        <div class="login-left">
            <div class="login-brand">
                <img src="imagenes/logo.png" alt="HalalConnect Logo" class="brand-logo">
                <h1>HalalConnect</h1>
            </div>
            <p class="login-tagline">Sistema profesional de gestión<br>de certificaciones Halal</p>
        </div>
        
        <div class="login-right">
            <div class="login-form-container">
                <h2>Bienvenido</h2>
                <p class="login-subtitle">Introduce tus credenciales para acceder</p>

                <form id="loginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="tu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-primary">Iniciar Sesión</button>
                    <p id="error-msg" class="error-msg"></p>
                </form>
                
                <div class="login-footer">
                    <p><a href="verificar.html">Verificar un certificado Halal</a></p>
                    <p>© 2026 HalalConnect · Oualid S'Baai</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
