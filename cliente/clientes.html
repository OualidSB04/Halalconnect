<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalalConnect — Clientes</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <div class="app-layout">

        <div class="topbar">
            <div>
                <div class="topbar-title">Clientes</div>
                <div class="topbar-subtitle">Empresas certificadas en la plataforma</div>
            </div>
            <div class="topbar-actions">
                <input type="text" id="buscador" placeholder="Buscar cliente..." oninput="filtrarClientes()">
                <button class="btn-add" onclick="abrirModal()">+ Nuevo Cliente</button>
                <button class="btn-secondary" onclick="exportarCSV()">Exportar CSV</button>
            </div>
        </div>

        <div class="page-content">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Empresa</th>
                            <th>Sector</th>
                            <th>Ciudad</th>
                            <th>Telefono</th>
                            <th>Email</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-clientes">
                        <tr><td colspan="6" style="text-align:center;padding:30px;color:#64748b">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3 id="modal-titulo">Nuevo Cliente</h3>
            <form id="formCliente">
                <input type="hidden" id="cliente-id">
                <div class="form-group">
                    <label>Nombre de la Empresa *</label>
                    <input type="text" id="nombre_empresa" required placeholder="Ej: Carniceria Al-Halal">
                </div>
                <div class="form-group">
                    <label>Sector</label>
                    <select id="sector">
                        <option value="">Selecciona sector...</option>
                        <option value="Alimentacion">Alimentacion</option>
                        <option value="Restauracion">Restauracion</option>
                        <option value="Cosmetica">Cosmetica</option>
                        <option value="Farmaceutico">Farmaceutico</option>
                        <option value="Textil">Textil</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Ciudad</label>
                    <input type="text" id="ciudad" placeholder="Ej: Madrid">
                </div>
                <div class="form-group">
                    <label>Telefono</label>
                    <input type="text" id="telefono" placeholder="Ej: 912345678">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Ej: contacto@empresa.es">
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/sidebar.js"></script>
    <script>generarSidebar('clientes');</script>
    <script src="js/clientes.js"></script>
</body>
</html>
