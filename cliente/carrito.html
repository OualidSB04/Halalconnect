<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalalConnect — Mi Carrito</title>
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        .mk-nav {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 40px; background: rgba(10,15,29,0.85);
            backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }
        .mk-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .mk-brand-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 12px; display: flex; align-items: center;
            justify-content: center; font-size: 20px;
            box-shadow: 0 4px 12px var(--primary-glow);
        }
        .mk-brand-name { font-size: 18px; font-weight: 800; color: var(--text); }
        .mk-brand-sub { font-size: 11px; color: var(--text-dim); }
        .mk-nav-links { display: flex; align-items: center; gap: 8px; }
        .mk-nav-links a {
            color: var(--text-muted); text-decoration: none; font-size: 14px;
            padding: 9px 16px; border-radius: 10px; transition: all 0.2s ease;
        }
        .mk-nav-links a:hover { color: var(--text); background: var(--bg-surface-2); }

        .car-container { max-width: 900px; margin: 0 auto; padding: 40px; }
        .car-titulo { font-size: 30px; font-weight: 800; color: var(--text); margin-bottom: 28px; letter-spacing: -0.02em; }
        .car-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 28px; align-items: start; }

        .car-item {
            display: flex; align-items: center; gap: 16px;
            background: var(--bg-surface); border: 1px solid var(--border);
            border-radius: 14px; padding: 16px; margin-bottom: 14px;
        }
        .car-item-img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: var(--bg-surface-2); }
        .car-item-info { flex: 1; }
        .car-item-nombre { font-size: 15px; font-weight: 600; color: var(--text); }
        .car-item-precio { font-size: 13px; color: var(--text-dim); }
        .car-cant { display: flex; align-items: center; gap: 10px; }
        .car-cant button {
            width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg-surface-2); color: var(--text); cursor: pointer; font-size: 16px;
        }
        .car-cant button:hover { background: var(--border); }
        .car-cant span { font-size: 15px; font-weight: 600; color: var(--text); min-width: 20px; text-align: center; }
        .car-quitar { background: none; border: none; color: var(--red); cursor: pointer; font-size: 13px; margin-left: 8px; }

        .car-resumen {
            background: var(--bg-surface); border: 1px solid var(--border);
            border-radius: 16px; padding: 24px; position: sticky; top: 100px;
        }
        .car-resumen h3 { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 18px; }
        .car-total-row { display: flex; justify-content: space-between; padding: 10px 0; font-size: 14px; color: var(--text-muted); }
        .car-total-final {
            display: flex; justify-content: space-between; padding: 16px 0 0;
            margin-top: 8px; border-top: 1px solid var(--border);
            font-size: 20px; font-weight: 800; color: var(--text);
        }
        .car-vacio { text-align: center; padding: 60px 20px; color: var(--text-dim); }

        .check-form { margin-top: 20px; }
        .check-pago-info {
            background: rgba(96,165,250,0.1); border-left: 3px solid var(--blue);
            padding: 12px 14px; border-radius: 0 10px 10px 0;
            font-size: 12px; color: var(--text-muted); margin-top: 16px; line-height: 1.5;
        }
    </style>
</head>
<body>

    <nav class="mk-nav">
        <a href="marketplace.html" class="mk-brand">
            <div class="mk-brand-icon">☪</div>
            <div>
                <div class="mk-brand-name">HalalConnect</div>
                <div class="mk-brand-sub">Marketplace Halal de confianza</div>
            </div>
        </a>
        <div class="mk-nav-links">
            <a href="marketplace.html">Productos</a>
            <a href="market_map.html">Tiendas</a>
            <a href="verificar.html">Verificar</a>
        </div>
    </nav>

    <div class="car-container">
        <div class="car-titulo">Mi Carrito</div>
        <div id="carrito-contenido"></div>
    </div>

    <script src="js/carrito.js"></script>
    <script>
        // pinta el carrito y el resumen
        function pintarCarrito() {
            const carrito = obtenerCarrito();
            const contenedor = document.getElementById('carrito-contenido');

            if (carrito.length === 0) {
                contenedor.innerHTML = `
                    <div class="car-vacio">
                        <div style="font-size:48px;margin-bottom:16px">🛒</div>
                        <p style="font-size:16px;margin-bottom:20px">Tu carrito está vacío</p>
                        <a href="marketplace.html" class="btn-primary" style="text-decoration:none">Ver productos</a>
                    </div>
                `;
                return;
            }

            let itemsHtml = '';
            carrito.forEach(item => {
                const img = `https://placehold.co/64x64/151d2e/10b981?text=${encodeURIComponent(item.nombre_producto.substring(0,3))}`;
                const subtotal = (parseFloat(item.precio_unidad) * item.cantidad).toFixed(2);
                itemsHtml += `
                    <div class="car-item">
                        <img src="${img}" class="car-item-img" alt="${item.nombre_producto}">
                        <div class="car-item-info">
                            <div class="car-item-nombre">${item.nombre_producto}</div>
                            <div class="car-item-precio">${parseFloat(item.precio_unidad).toFixed(2)} € / unidad</div>
                        </div>
                        <div class="car-cant">
                            <button onclick="cambiarCantidad(${item.producto_id}, -1)">−</button>
                            <span>${item.cantidad}</span>
                            <button onclick="cambiarCantidad(${item.producto_id}, 1)">+</button>
                        </div>
                        <div style="font-weight:700;color:var(--text);min-width:70px;text-align:right">${subtotal} €</div>
                        <button class="car-quitar" onclick="quitarDelCarrito(${item.producto_id})">Quitar</button>
                    </div>
                `;
            });

            const total = calcularTotal().toFixed(2);

            contenedor.innerHTML = `
                <div class="car-grid">
                    <div>${itemsHtml}</div>
                    <div class="car-resumen">
                        <h3>Resumen del pedido</h3>
                        <div class="car-total-row"><span>Productos</span><span>${carrito.length}</span></div>
                        <div class="car-total-row"><span>Envío</span><span>Gratis</span></div>
                        <div class="car-total-final"><span>Total</span><span>${total} €</span></div>

                        <form class="check-form" id="formCheckout">
                            <div class="form-group">
                                <label>Nombre completo *</label>
                                <input type="text" id="check-nombre" required placeholder="Tu nombre">
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" id="check-email" placeholder="tu@email.com">
                            </div>
                            <div class="form-group">
                                <label>Dirección de envío *</label>
                                <input type="text" id="check-direccion" required placeholder="Calle, número, ciudad">
                            </div>
                            <button type="submit" class="btn-primary" style="width:100%;padding:14px;font-size:15px">
                                Continuar al pago
                            </button>
                        </form>
                    </div>
                </div>
            `;

            document.getElementById('formCheckout').addEventListener('submit', irAlPago);
        }

        // guardamos los datos de envio y mostramos la pantalla de pago
        let datosEnvio = {};

        function irAlPago(e) {
            e.preventDefault();
            datosEnvio = {
                nombre: document.getElementById('check-nombre').value,
                email: document.getElementById('check-email').value,
                direccion: document.getElementById('check-direccion').value
            };
            pintarPago();
        }

        // pantalla de pago con tarjeta (simulada)
        function pintarPago() {
            const total = calcularTotal().toFixed(2);
            const contenedor = document.getElementById('carrito-contenido');

            contenedor.innerHTML = `
                <div style="max-width:480px;margin:0 auto">
                    <div class="car-resumen">
                        <h3>💳 Pago con tarjeta</h3>
                        <p style="color:var(--text-muted);font-size:13px;margin-bottom:20px">
                            Total a pagar: <strong style="color:var(--primary);font-size:18px">${total} €</strong>
                        </p>

                        <form id="formPago">
                            <div class="form-group">
                                <label>Número de tarjeta *</label>
                                <input type="text" id="card-num" required maxlength="19"
                                       placeholder="1234 5678 9012 3456"
                                       oninput="formatearTarjeta(this)">
                            </div>
                            <div style="display:flex;gap:14px">
                                <div class="form-group" style="flex:1">
                                    <label>Caducidad *</label>
                                    <input type="text" id="card-exp" required maxlength="5" placeholder="MM/AA"
                                           oninput="formatearCaducidad(this)">
                                </div>
                                <div class="form-group" style="flex:1">
                                    <label>CVV *</label>
                                    <input type="text" id="card-cvv" required maxlength="3" placeholder="123">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Titular de la tarjeta *</label>
                                <input type="text" id="card-name" required placeholder="Como aparece en la tarjeta">
                            </div>
                            <button type="submit" class="btn-primary" style="width:100%;padding:14px;font-size:15px">
                                Pagar ${total} €
                            </button>
                        </form>

                        <button onclick="pintarCarrito()" class="btn-secondary" style="width:100%;margin-top:10px">
                            ← Volver
                        </button>

                        <div class="check-pago-info">
                            🔒 Simulación de pago. No se procesa ningún cargo real. En producción
                            se integraría con Stripe o Redsys mediante conexión segura HTTPS.
                            El pedido se guarda en la base de datos.
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('formPago').addEventListener('submit', confirmarPedido);
        }

        // formatea el numero de tarjeta en grupos de 4
        function formatearTarjeta(input) {
            let v = input.value.replace(/\D/g, '').substring(0, 16);
            input.value = v.replace(/(.{4})/g, '$1 ').trim();
        }

        // formatea la caducidad como MM/AA
        function formatearCaducidad(input) {
            let v = input.value.replace(/\D/g, '').substring(0, 4);
            if (v.length >= 3) v = v.substring(0, 2) + '/' + v.substring(2);
            input.value = v;
        }

        // envia el pedido al backend (tras el pago simulado)
        async function confirmarPedido(e) {
            e.preventDefault();
            const carrito = obtenerCarrito();

            const datos = {
                nombre: datosEnvio.nombre,
                email: datosEnvio.email,
                direccion: datosEnvio.direccion,
                items: carrito
            };

            try {
                const respuesta = await fetch(`${API_URL_CARRITO}/pedidos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
                const resultado = await respuesta.json();

                if (respuesta.ok) {
                    vaciarCarrito();
                    document.getElementById('carrito-contenido').innerHTML = `
                        <div class="car-vacio">
                            <div style="font-size:56px;margin-bottom:16px">✅</div>
                            <h2 style="color:var(--primary);font-size:24px;margin-bottom:10px">¡Pago realizado y pedido confirmado!</h2>
                            <p style="margin-bottom:8px">Tu pedido <strong style="color:var(--text)">#${resultado.pedido.id}</strong> se ha registrado correctamente.</p>
                            <p style="margin-bottom:24px">Total pagado: <strong style="color:var(--text)">${parseFloat(resultado.pedido.total).toFixed(2)} €</strong></p>
                            <a href="marketplace.html" class="btn-primary" style="text-decoration:none">Seguir comprando</a>
                        </div>
                    `;
                } else {
                    alert(resultado.error || 'Error al procesar el pedido');
                }
            } catch (error) {
                alert('Error de conexión con el servidor');
            }
        }

        pintarCarrito();
    </script>
</body>
</html>
