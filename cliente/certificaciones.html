<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalalConnect — Certificaciones</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <div class="app-layout">

        <div class="topbar">
            <div>
                <div class="topbar-title">Certificaciones</div>
                <div class="topbar-subtitle">Gestion de certificados Halal emitidos</div>
            </div>
            <div class="topbar-actions">
                <input type="text" id="buscador" placeholder="Buscar certificacion..." oninput="filtrarCertificaciones()">
                <button class="btn-add" onclick="abrirModal()">+ Nueva Certificacion</button>
                <button class="btn-secondary" onclick="exportarCSV()">Exportar CSV</button>
            </div>
        </div>

        <div class="page-content">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Numero</th>
                            <th>Empresa</th>
                            <th>Tipo</th>
                            <th>Emision</th>
                            <th>Caducidad</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-certificaciones">
                        <tr><td colspan="7" style="text-align:center;padding:30px;color:#64748b">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3 id="modal-titulo">Nueva Certificacion</h3>
            <form id="formCertificacion">
                <input type="hidden" id="cert-id">
                <div class="form-group">
                    <label>Empresa Cliente *</label>
                    <select id="cliente_id" required>
                        <option value="">Selecciona empresa...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Numero de Certificado *</label>
                    <input type="text" id="numero_certificado" required placeholder="Ej: HALAL-2024-001">
                </div>
                <div class="form-group">
                    <label>Tipo</label>
                    <select id="tipo">
                        <option value="Alimentacion">Alimentacion</option>
                        <option value="Restauracion">Restauracion</option>
                        <option value="Cosmetica">Cosmetica</option>
                        <option value="Farmaceutico">Farmaceutico</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Fecha de Emision *</label>
                    <input type="date" id="fecha_emision" required>
                </div>
                <div class="form-group">
                    <label>Fecha de Caducidad *</label>
                    <input type="date" id="fecha_caducidad" required>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/sidebar.js"></script>
    <script>generarSidebar('certificaciones');</script>
    <script src="js/certificaciones.js"></script>
</body>
</html>
