<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalalConnect — Usuarios</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <nav class="navbar">  
        <div class="navbar-brand"><img src="imagenes/logo.png" alt="Logo" class="navbar-logo">HalalConnect</div>
        <div class="navbar-menu">
            <a href="dashboard.html">Dashboard</a>
            <a href="clientes.html">Clientes</a>
            <a href="certificaciones.html">Certificaciones</a>
            <a href="usuarios.html">Usuarios</a>
            <span id="usuario-nombre"></span>
            <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h2>Gestión de Usuarios</h2>
            <button class="btn-add" onclick="abrirModal()">+ Nuevo Usuario</button>
        </div>

        <div class="search-bar">
            <input type="text" id="buscador" placeholder="Buscar por nombre, email o rol..." oninput="filtrarUsuarios()">
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>Fecha de Creación</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-usuarios">
                    <tr><td colspan="5" style="text-align: center; padding: 30px;">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3 id="modal-titulo">Nuevo Usuario</h3>
            <form id="formUsuario">
                <input type="hidden" id="usuario-id">
                <div class="form-group">
                    <label>Nombre Completo *</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group" id="grupo-password">
                    <label>Contraseña *</label>
                    <input type="password" id="password" placeholder="Mínimo 6 caracteres">
                </div>
                <div class="form-group">
                    <label>Rol *</label>
                    <select id="rol" required>
                        <option value="empleado">Empleado</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/usuarios.js"></script>
</body>
</html>
