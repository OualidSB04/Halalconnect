<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalalConnect — Usuarios</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <div class="app-layout">

        <div class="topbar">
            <div>
                <div class="topbar-title">Usuarios</div>
                <div class="topbar-subtitle">Gestion de usuarios del sistema</div>
            </div>
            <div class="topbar-actions">
                <input type="text" id="buscador" placeholder="Buscar usuario..." oninput="filtrarUsuarios()">
                <button class="btn-add" onclick="abrirModal()">+ Nuevo Usuario</button>
            </div>
        </div>

        <div class="page-content">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Rol</th>
                            <th>Fecha Registro</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-usuarios">
                        <tr><td colspan="5" style="text-align:center;padding:30px;color:#64748b">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3 id="modal-titulo">Nuevo Usuario</h3>
            <form id="formUsuario">
                <input type="hidden" id="usuario-id">
                <div class="form-group">
                    <label>Nombre Completo *</label>
                    <input type="text" id="nombre" required placeholder="Ej: Juan Garcia">
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="email" required placeholder="Ej: juan@halalconnect.es">
                </div>
                <div class="form-group" id="grupo-password">
                    <label>Contrasena *</label>
                    <input type="password" id="password" placeholder="Minimo 6 caracteres">
                </div>
                <div class="form-group">
                    <label>Rol</label>
                    <select id="rol">
                        <option value="empleado">Empleado</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/sidebar.js"></script>
    <script>generarSidebar('usuarios');</script>
    <script src="js/usuarios.js"></script>
</body>
</html>
