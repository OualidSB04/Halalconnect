<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalalConnect — Mi Perfil</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand"><img src="imagenes/logo.png" alt="Logo" class="navbar-logo">HalalConnect</div>
        <div class="navbar-menu">
            <a href="dashboard.html">Dashboard</a>
            <a href="clientes.html">Clientes</a>
            <a href="certificaciones.html">Certificaciones</a>
            <span id="usuario-nombre"></span>
            <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h2>Mi Perfil</h2>
        </div>

        <div class="perfil-grid">
            <!-- Tarjeta de información del usuario -->
            <div class="perfil-card">
                <h3>Información Personal</h3>
                <form id="formPerfil">
                    <div class="form-group">
                        <label>Nombre Completo</label>
                        <input type="text" id="nombre" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label>Rol</label>
                        <input type="text" id="rol" disabled>
                    </div>
                    <div class="form-group">
                        <label>Fecha de Creación</label>
                        <input type="text" id="creado_en" disabled>
                    </div>
                    <button type="submit" class="btn-primary">Guardar Cambios</button>
                    <p id="mensaje-perfil" class="success-msg"></p>
                </form>
            </div>

            <!-- Tarjeta de cambio de contraseña -->
            <div class="perfil-card">
                <h3>Cambiar Contraseña</h3>
                <form id="formPassword">
                    <div class="form-group">
                        <label>Contraseña Actual</label>
                        <input type="password" id="passwordActual" required>
                    </div>
                    <div class="form-group">
                        <label>Nueva Contraseña</label>
                        <input type="password" id="passwordNueva" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label>Confirmar Nueva Contraseña</label>
                        <input type="password" id="passwordConfirmar" required minlength="6">
                    </div>
                    <button type="submit" class="btn-primary">Cambiar Contraseña</button>
                    <p id="mensaje-password" class="error-msg"></p>
                </form>
            </div>
        </div>
    </div>

    <script src="js/perfil.js"></script>
</body>
</html>
