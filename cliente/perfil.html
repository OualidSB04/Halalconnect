<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalalConnect — Mi Perfil</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <div class="app-layout">

        <div class="topbar">
            <div>
                <div class="topbar-title">Mi Perfil</div>
                <div class="topbar-subtitle">Gestiona tu informacion personal</div>
            </div>
        </div>

        <div class="page-content">
            <div class="grid-2">

                <!-- datos personales -->
                <div class="card">
                    <div class="card-header">
                        <div>
                            <div class="card-title">Datos Personales</div>
                            <div class="card-subtitle">Actualiza tu nombre y email</div>
                        </div>
                    </div>

                    <!-- avatar grande -->
                    <div style="text-align:center;margin-bottom:24px">
                        <div id="avatar-grande" style="width:80px;height:80px;background:#10b981;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;margin:0 auto 12px">U</div>
                        <div id="nombre-display" style="font-size:18px;font-weight:600;color:#f8fafc"></div>
                        <div id="rol-display" style="font-size:13px;color:#64748b;margin-top:4px"></div>
                    </div>

                    <div id="alerta-perfil" class="alert"></div>

                    <form id="formPerfil">
                        <div class="form-group">
                            <label>Nombre Completo</label>
                            <input type="text" id="nombre" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="email" required>
                        </div>
                        <button type="submit" class="btn-primary" style="width:100%">
                            Guardar Cambios
                        </button>
                    </form>
                </div>

                <!-- cambiar contrasena -->
                <div class="card">
                    <div class="card-header">
                        <div>
                            <div class="card-title">Cambiar Contrasena</div>
                            <div class="card-subtitle">Minimo 6 caracteres</div>
                        </div>
                    </div>

                    <div id="alerta-password" class="alert"></div>

                    <form id="formPassword">
                        <div class="form-group">
                            <label>Contrasena Actual</label>
                            <input type="password" id="password_actual" required placeholder="Tu contrasena actual">
                        </div>
                        <div class="form-group">
                            <label>Nueva Contrasena</label>
                            <input type="password" id="password_nueva" required placeholder="Minimo 6 caracteres">
                        </div>
                        <div class="form-group">
                            <label>Confirmar Nueva Contrasena</label>
                            <input type="password" id="password_confirmar" required placeholder="Repite la nueva contrasena">
                        </div>
                        <button type="submit" class="btn-primary" style="width:100%">
                            Cambiar Contrasena
                        </button>
                    </form>
                </div>

            </div>
        </div>

    </div>

    <script src="js/sidebar.js"></script>
    <script>generarSidebar('perfil');</script>
    <script src="js/perfil.js"></script>
</body>
</html>
